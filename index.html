        <p style="margin:0;font-size:18px;line-height:1.6;color:#1c1e22;text-wrap:pretty">Für Clubs beginnt es oft mit einem Zeichen: dem Wappen, den Farben oder einem Satz, der alle verbindet. Auf dem Zifferblatt oder im Gehäuseboden wird daraus ein persönliches Detail. Namen, Jahrgänge und Funktionen lassen sich im Entwurf mitdenken.</p>

        <p style="margin:0;font-size:18px;line-height:1.6;color:#1c1e22;text-wrap:pretty">Ein Jubiläum. Ein Signet. Eine Geste, die bleibt. Für Mitarbeitende, Kunden oder Menschen, die ein Unternehmen geprägt haben. Logo, Gravur und Gestaltung werden auf den Anlass abgestimmt – vom persönlichen Geschenk bis zur gemeinsamen Serie.</p>

function wrapEngraving(text) {
  const t = text.trim();
  if (!t) return [];
  for (let max = 14; max <= 42; max++) {
    const lines = []; let cur = '';
    for (const w of t.split(/\s+/)) {
      let word = w;
      while (word.length > max) { if (cur) { lines.push(cur); cur = ''; } lines.push(word.slice(0, max)); word = word.slice(max); }
      if (!word) continue;
      if (!cur) cur = word; else if ((cur + ' ' + word).length <= max) cur += ' ' + word; else { lines.push(cur); cur = word; }
    }
    if (cur) lines.push(cur);
    if (lines.length <= 3) return lines;
  }
  return [t];
}

        clearTimeout(this.noticeT);
        this.setState({ adopted: true, cfgNotice: 'Konfiguration übernommen', formLive: 'Konfiguration in die Anfrage übernommen.' });
        this.noticeT = setTimeout(() => this.setState({ cfgNotice: '' }), 2600);
        this.formUrlFocus();
      },
      confirmReset: s.confirmReset,
      askReset: () => { if (c.dialText || c.engraving) this.setState({ confirmReset: true }, () => this.resetYesRef.current && this.resetYesRef.current.focus()); else this.setCfg({ ...DEFAULT }); },
      doReset: () => { this.setState({ confirmReset: false, engFocused: false }, () => this.resetBtnRef.current && this.resetBtnRef.current.focus()); this.setCfg({ ...DEFAULT }); },
      cancelReset: () => this.setState({ confirmReset: false }, () => this.resetBtnRef.current && this.resetBtnRef.current.focus()),
      resetYesRef: this.resetYesRef, resetBtnRef: this.resetBtnRef,
      faqs: FAQ.map(([q, a], i) => { const o = !!s.faqOpen[i]; return { q, a, bid: 'faq-b' + i, pid: 'faq-p' + i, exp: o ? 'true' : 'false', hid: o ? 'false' : 'true', rows: o ? '1fr' : '0fr', vert: o ? 'scaleY(0)' : 'scaleY(1)', toggle: () => this.setState(st => ({ faqOpen: { ...st.faqOpen, [i]: !st.faqOpen[i] } })) }; }),
      gallery: GALLERY.map(g => ({ ...g, ph: `${g.ph} – ${g.t}` })),
      notDone: !s.done, done: s.done, preventSubmit: e => e.preventDefault(), stepHeadId: 'step-h-' + s.step,
      stepOf: `Schritt ${s.step} von 4`, progressT: `scaleX(${s.step / 4})`,
      stepNames: STEPS.map((t, i) => ({ n: i + 1, t, cur: s.step === i + 1 ? 'step' : undefined, fw: s.step === i + 1 ? 600 : 400, col: s.step === i + 1 ? '#1c1e22' : '#5c6570' })),
      showErrSummary: s.showErrSummary, f, on: this.on, er, inv, bd, db, hide, disp,
      adopted: s.adopted, notAdopted: !s.adopted, cfgFull: this.cfgRows().map(r => `${r.k}: ${r.v}`).join(' · '),
      cfgRows: this.cfgRows(), cfgNotice: s.cfgNotice,
      mini: { strap: byId(STRAP, c.strap).mini, case: c.finish === 'pvd' ? '#2a2d31' : (c.finish === 'poliert' ? '#dfe5ea' : '#c5ced6'), dial: byId(DIAL, c.dial).mini, hand: light ? '#1c1e22' : '#f3f0e8' },
      fileRef: this.fileRef, pickFile: () => this.fileRef.current && this.fileRef.current.click(),
      onFile: (e) => {
        const file = e.target.files && e.target.files[0]; if (!file) return;
        const ext = (file.name.split('.').pop() || '').toLowerCase();
        if (!['svg', 'pdf', 'png'].includes(ext)) { e.target.value = ''; return this.setState({ fileErr: 'Bitte eine SVG-, PDF- oder PNG-Datei wählen.' }); }
        if (file.size > 10 * 1024 * 1024) { e.target.value = ''; return this.setState({ fileErr: 'Die Datei ist grösser als 10 MB (Demo-Grenze).' }); }
        this.setState({ file: { name: file.name, type: ext.toUpperCase() }, fileErr: '' });
      },
      removeFile: () => { if (this.fileRef.current) this.fileRef.current.value = ''; this.setState({ file: null, fileErr: '' }); this.focusLater('f-logo', 30); },
      hasFile: !!s.file, fileErr: s.fileErr, fileStatus: s.file ? `${s.file.name} (${s.file.type})` : 'Keine Datei gewählt',
      msgCount: `${f.nachricht.length} / 2000`,
      review, canBack: s.step > 1, notLast: s.step < 4, isLast: s.step === 4,
      back: () => this.goStep(Math.max(1, s.step - 1)),
      next: () => { const e = this.validate(s.step); if (Object.keys(e).length) return this.failWith(s.step, e); this.goStep(s.step + 1); },
      finish: () => {
        for (const n of [1, 3]) { const e = this.validate(n); if (Object.keys(e).length) return this.failWith(n, e); }
        this.setState({ done: true, formLive: 'Demo-Anfrage abgeschlossen. Es wurde nichts gesendet.' }, () => this.focusLater('done-h', 60));
      },
      editAll: () => this.goStep(4), formLive: s.formLive,
      year: new Date().getFullYear()
    };
  }
}
</script>
